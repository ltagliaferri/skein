name: K-A9 Live (ECDSA nonce non-reuse)

# Security tripwire. Drives real sigstore-python signing against live Sigstore
# staging and asserts the ECDSA r value is distinct across N signings — a
# repeated r enables ECDSA private-key recovery (K-A9). NOT part of normal CI:
# live network + real identity, slow, opt-in. The offline suite structurally
# cannot cover this (test_sign_is_non_deterministic always installs the fake
# signer, so bundles differ by construction and a real nonce collision is
# unobservable). See brief-20260519-5aa5 / finding-20260519-1dxs.
#
# Identity: GitHub Actions ambient OIDC. `id-token: write` lets the job mint a
# short-lived OIDC token (audience "sigstore") with no stored secret and no
# human at a browser — a fresh token per run. The test reads it from
# SKEIN_TEST_SIGSTORE_TOKEN (same env contract as the offline-skipped staging
# tests), so no test code changes are needed to wire CI identity.
#
# VERIFY ON FIRST REAL RUN UP NORTH (environment facts, not baked-in
# guarantees — the brief's process caveat forbids asserting unverified
# library/infra behavior):
#   1. Sigstore *staging* Fulcio trusts issuer
#      https://token.actions.githubusercontent.com for this repo's workflow
#      identity. If staging rejects the identity, this is a Fulcio staging
#      trust-policy question, not a test defect.
#   2. provider_id is a SKEIN-side label; when an explicit token is supplied
#      sigstore-python keys off the token's own issuer claim. The
#      SKEIN_TEST_SIGSTORE_PROVIDER_ID below is a hint — adjust if staging
#      rejects it.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # nightly 07:00 UTC

permissions:
  contents: read
  id-token: write

jobs:
  k-a9-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Mint ambient OIDC token (audience sigstore)
        run: |
          # $ACTIONS_ID_TOKEN_REQUEST_URL already carries a query string, so
          # the audience is appended with '&'.
          TOKEN="$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" \
            | python -c 'import sys, json; print(json.load(sys.stdin)["value"])')"
          if [ -z "$TOKEN" ]; then
            echo "Failed to mint ambient OIDC token" >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "SKEIN_TEST_SIGSTORE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run K-A9 live nonce-reuse test
        env:
          SKEIN_TEST_SIGSTORE_LIVE: "1"
          SKEIN_TEST_SIGSTORE_ISSUER: "https://token.actions.githubusercontent.com"
          SKEIN_TEST_SIGSTORE_PROVIDER_ID: "github-actions"
          SKEIN_TEST_SIGSTORE_N: "8"
        run: |
          pytest tests/test_signing/test_sign.py -v \
            -k "nonce_not_reused_across_n_signings"
