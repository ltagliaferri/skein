<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SKEIN{% endblock %}</title>
  <style>
    body { max-width: 42rem; margin: 1rem auto; padding: 0 1rem; }
    ul.folios { padding-left: 1.2rem; }
    pre { overflow-x: auto; }
  </style>
</head>
<body>
  <header>
    <strong><a href="/">{{ project_id }}</a></strong>
    <nav>
      <a href="/">overview</a> ·
      <form action="/search" method="get" style="display:inline">
        <input type="search" name="q" placeholder="search folios" value="{{ q|default('') }}">
        <button type="submit">go</button>
      </form>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>SKEIN — read-only surface. Provenance shown per folio.</footer>
</body>
</html>
